name: test_lectorapp
description: A new experience about opinions.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0 
  share_plus: ^10.1.2 
  google_fonts: ^6.2.1
  flutter_displaymode: ^0.6.0
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^10.3.1
  flutter_background_service: ^5.0.1
  flutter_local_notifications: ^17.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4  # Generador de Íconos (>=0.14 para la capa monochrome)
  flutter_native_splash: ^2.3.1

flutter:
  uses-material-design: true
  # La carpeta assets/ NO se empaqueta en la app: solo contiene las imágenes fuente para
  # generar íconos y splash (el código no las usa). Si algún día se usa una imagen en la UI,
  # declararla aquí individualmente.
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700


# Íconos y splash: fuentes en assets/icon/ (generadas desde el ícono original transparente).
# Regenerar con:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# IMPORTANTE: las imágenes del primer plano deben tener FONDO TRANSPARENTE; si no, se pierde el
# ícono temático (Android 13+ / HyperOS) y el splash muestra un cuadrado.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true                       # iOS no admite íconos con transparencia
  image_path: "assets/icon/icon_legacy.png"    # Android < 8, iOS y web: libro sobre crema
  adaptive_icon_background: "#FDFBF7"          # Crema
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"   # libro transparente, ya con margen seguro
  adaptive_icon_foreground_inset: 0            # el margen ya viene en la imagen
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"   # ícono temático (Android 13+ / HyperOS)

flutter_native_splash:
  # Android < 12, iOS y web
  color: "#FDFBF7"                             # Crema (tema claro)
  image: "assets/icon/splash.png"
  color_dark: "#1C1917"                        # Café de Medianoche (modo oscuro del sistema)
  image_dark: "assets/icon/splash.png"
  # Android 12+: el sistema dibuja el ícono dentro de un círculo => imagen con margen
  android_12:
    color: "#FDFBF7"
    image: "assets/icon/splash_android12.png"
    color_dark: "#1C1917"
    image_dark: "assets/icon/splash_android12.png"